name: Offline security dependency checks
on:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - name: Compile application source without running any bot or external API
        run: python -m compileall -q -x '(^|/)(venv|\.venv|\.vscode|env\.py)(/|$)' .
      - name: Offline regression checks with synthetic inputs
        run: python -m unittest discover -s tests -v
